name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - name: Build Entware packages
        run: opkg/build.sh "${GITHUB_REF_NAME#v}" build/release
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: build/release/*.ipk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*.ipk
          fail_on_unmatched_files: true
          generate_release_notes: true

  pages-artifact:
    if: vars.PUBLISH_OPKG_FEED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - uses: actions/configure-pages@v6
      - name: Generate OPKG feed
        run: |
          opkg/feed.sh build/pages packages/*_aarch64-3.10.ipk packages/*_mipsel-3.4.ipk
      - name: Name Pages artifact
        id: artifact
        run: printf 'name=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/pages

  pages:
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: opkg-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: ${{ needs.pages-artifact.outputs.artifact_name }}
